name: Deactivate stuck Pages deployment

on:
  push:
    branches:
      - main

permissions:
  deployments: write

jobs:
  deactivate:
    if: github.repository == 'XuJiacong/XuJiacong.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale deployment record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/XuJiacong/XuJiacong.github.io/deployments/5653362627
