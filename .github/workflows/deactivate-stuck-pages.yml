name: Deactivate stuck Pages deployment

on:
  push:
    branches:
      - main

permissions:
  pages: write

jobs:
  deactivate:
    if: github.repository == 'XuJiacong/XuJiacong.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/XuJiacong/XuJiacong.github.io/pages/deployments/fd33a8fac369585a7225639947a238e4929e133e/cancel
